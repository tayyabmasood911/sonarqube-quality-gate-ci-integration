# ==============================================================================
# Enterprise SonarQube Multi-Language Analysis & Quality Gate Configuration
# ==============================================================================

# Core Project Identification
sonar.projectKey=enterprise-cloud-platform
sonar.projectName=Enterprise Cloud Platform Architecture
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source Code & Test File Inclusion
sonar.sources=src,lib,cmd,pkg
sonar.tests=tests,test,spec
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/test_*.py,**/*_test.go

# Comprehensive File & Directory Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.generated.*

# Code Duplication Settings
sonar.cpd.exclusions=**/*.dto.ts,**/models/**,**/fixtures/**,**/mocks/**

# Multi-Language Test Coverage Reports
# JavaScript / TypeScript (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Python (Coverage.py XML)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11,3.12

# Go (go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Java (JaCoCo XML)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Security Hotspots & Quality Gate Synchronization
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.scm.provider=git
sonar.scm.disabled=false
