<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="72" cy="56" r="14" fill="#0284c7" opacity="0.12"/>
  <path d="M 66 56 L 70 60 L 78 52" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="62" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="-0.3">Enterprise SonarQube Quality Gate &amp; CI/CD Enforcement Pipeline</text>
  
  <rect x="880" y="42" width="125" height="28" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="898" y="60" fill="#15803d" font-size="11" font-weight="700">QUALITY GATE</text>
  <rect x="1015" y="42" width="125" height="28" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1036" y="60" fill="#1d4ed8" font-size="11" font-weight="700">REST API v2</text>

  <!-- COLUMN 1: CI Pipeline & Test Artifacts -->
  <rect x="40" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 40 122 A 10 10 0 0 1 50 112 L 280 112 A 10 10 0 0 1 290 122 L 290 156 L 40 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="141" fill="#0f172a" font-size="13" font-weight="700">1. BUILD &amp; COVERAGE</text>

  <rect x="56" y="174" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="200" fill="#0f172a" font-size="13" font-weight="700">Multi-Language Codebase</text>
  <text x="70" y="222" fill="#64748b" font-size="11">TypeScript, Python, Go, Java</text>
  <rect x="70" y="236" width="120" height="20" rx="4" fill="#e0f2fe"/>
  <text x="78" y="250" fill="#0369a1" font-size="10" font-weight="600">sonar.sources=src,lib</text>

  <rect x="56" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="312" fill="#0f172a" font-size="13" font-weight="700">Coverage Reports</text>
  <text x="70" y="334" fill="#64748b" font-size="11">LCOV, Coverage.py, JaCoCo</text>
  <rect x="70" y="348" width="130" height="20" rx="4" fill="#f0fdf4"/>
  <text x="78" y="362" fill="#15803d" font-size="10" font-weight="600">coverage/lcov.info</text>

  <rect x="56" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="424" fill="#0f172a" font-size="13" font-weight="700">Git Context Metadata</text>
  <text x="70" y="446" fill="#64748b" font-size="11">Branch / Pull Request ID</text>
  <rect x="70" y="460" width="140" height="20" rx="4" fill="#fef3c7"/>
  <text x="78" y="474" fill="#b45309" font-size="10" font-weight="600">PR Decoration Target</text>

  <rect x="56" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="536" fill="#0f172a" font-size="13" font-weight="700">Project Configuration</text>
  <text x="70" y="558" fill="#64748b" font-size="11">sonar-project.properties</text>
  <text x="70" y="578" fill="#0284c7" font-size="10" font-weight="600">Deterministic Exclusions</text>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="290" y1="372" x2="330" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: SonarScanner Execution -->
  <rect x="330" y="112" width="260" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 330 122 A 10 10 0 0 1 340 112 L 580 112 A 10 10 0 0 1 590 122 L 590 156 L 330 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="348" y="141" fill="#0f172a" font-size="13" font-weight="700">2. SCANNER EXECUTION</text>

  <rect x="348" y="174" width="224" height="135" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="362" y="200" fill="#0369a1" font-size="14" font-weight="700">run_sonar_scanner.sh</text>
  <text x="362" y="222" fill="#0f172a" font-size="11">CLI &amp; Docker Runner Support</text>
  <text x="362" y="240" fill="#64748b" font-size="11">• Ingests $SONAR_TOKEN safely</text>
  <text x="362" y="258" fill="#64748b" font-size="11">• Maps SCM diff and PR metadata</text>
  <text x="362" y="276" fill="#64748b" font-size="11">• Injects analysis parameters</text>
  <rect x="362" y="284" width="135" height="16" rx="3" fill="#0284c7"/>
  <text x="368" y="295" fill="#ffffff" font-size="9" font-weight="700">SONARSCANNER CLI</text>

  <rect x="348" y="325" width="224" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="351" fill="#0f172a" font-size="13" font-weight="700">Static Analysis Core</text>
  <text x="362" y="373" fill="#64748b" font-size="11">Sensors &amp; AST Analysis</text>
  <text x="362" y="393" fill="#475569" font-size="11">• Bug &amp; Vulnerability detection</text>
  <text x="362" y="411" fill="#475569" font-size="11">• Code Smell &amp; Maintainability</text>
  <rect x="362" y="426" width="140" height="20" rx="4" fill="#dcfce7"/>
  <text x="370" y="440" fill="#15803d" font-size="10" font-weight="600">Local Parsing Complete</text>

  <rect x="348" y="476" width="224" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="502" fill="#0f172a" font-size="13" font-weight="700">Report Task Artifact</text>
  <text x="362" y="524" fill="#64748b" font-size="11">.scannerwork/report-task.txt</text>
  <text x="362" y="544" fill="#475569" font-size="11">• ceTaskId (Compute Engine ID)</text>
  <text x="362" y="564" fill="#475569" font-size="11">• serverUrl &amp; dashboardUrl</text>
  <text x="362" y="586" fill="#0284c7" font-size="10" font-weight="600">Asynchronous Handoff</text>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="590" y1="372" x2="630" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: SonarQube Server & Compute Engine -->
  <rect x="630" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 630 122 A 10 10 0 0 1 640 112 L 870 112 A 10 10 0 0 1 880 122 L 880 156 L 630 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="141" fill="#0f172a" font-size="13" font-weight="700">3. SONARQUBE SERVER</text>

  <rect x="646" y="174" width="218" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="200" fill="#0f172a" font-size="13" font-weight="700">Compute Engine (CE)</text>
  <text x="660" y="222" fill="#64748b" font-size="11">Asynchronous report processor</text>
  <text x="660" y="240" fill="#475569" font-size="11">• Aggregates metrics &amp; AST</text>
  <text x="660" y="258" fill="#475569" font-size="11">• Calculates test coverage %</text>
  <text x="660" y="276" fill="#475569" font-size="11">• Measures duplication index</text>
  <rect x="660" y="284" width="135" height="16" rx="3" fill="#16a34a"/>
  <text x="666" y="295" fill="#ffffff" font-size="9" font-weight="700">STATUS: SUCCESS</text>

  <rect x="646" y="325" width="218" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="351" fill="#0f172a" font-size="13" font-weight="700">Quality Gate Evaluation</text>
  <text x="660" y="373" fill="#dc2626" font-size="10" font-weight="600">• New Reliability Rating = A</text>
  <text x="660" y="391" fill="#dc2626" font-size="10" font-weight="600">• New Security Rating = A</text>
  <text x="660" y="409" fill="#15803d" font-size="10" font-weight="600">• Coverage on New Code &gt;= 80%</text>
  <text x="660" y="427" fill="#15803d" font-size="10" font-weight="600">• Duplicated Lines &lt;= 3.0%</text>
  <rect x="660" y="435" width="125" height="16" rx="3" fill="#e0f2fe"/>
  <text x="666" y="446" fill="#0369a1" font-size="9" font-weight="700">ENTERPRISE POLICY</text>

  <rect x="646" y="476" width="218" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="502" fill="#0f172a" font-size="13" font-weight="700">REST API Endpoints</text>
  <text x="660" y="524" fill="#64748b" font-size="11">Pollable JSON endpoints:</text>
  <text x="660" y="544" fill="#475569" font-size="10">/api/ce/task?id=$ID</text>
  <text x="660" y="564" fill="#475569" font-size="10">/api/qualitygates/project_status</text>
  <text x="660" y="586" fill="#0284c7" font-size="10" font-weight="600">Bearer / Token Auth</text>

  <!-- Flow Arrow 3 to 4 -->
  <line x1="880" y1="372" x2="920" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 4: Gate Enforcer & CI/CD Blocker -->
  <rect x="920" y="112" width="240" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 920 122 A 10 10 0 0 1 930 112 L 1150 112 A 10 10 0 0 1 1160 122 L 1160 156 L 920 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="936" y="141" fill="#0f172a" font-size="13" font-weight="700">4. CI GATE ENFORCER</text>

  <rect x="936" y="174" width="208" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="200" fill="#0f172a" font-size="13" font-weight="700">check_quality_gate.sh</text>
  <text x="950" y="222" fill="#64748b" font-size="11">Exponential backoff poller</text>
  <text x="950" y="242" fill="#475569" font-size="11">Parses project_status JSON</text>
  <text x="950" y="258" fill="#475569" font-size="11">Extracts condition metrics</text>
  <text x="950" y="272" fill="#0284c7" font-size="10" font-weight="600">Pure curl + Python Engine</text>

  <rect x="936" y="300" width="208" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="326" fill="#0f172a" font-size="13" font-weight="700">GitHub Step Summary</text>
  <text x="950" y="348" fill="#64748b" font-size="11">Real-time Markdown status</text>
  <text x="950" y="368" fill="#16a34a" font-size="11" font-weight="600">Visual Metrics Scorecard</text>
  <text x="950" y="384" fill="#475569" font-size="10">Inline PR feedback</text>

  <rect x="936" y="416" width="208" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="442" fill="#0f172a" font-size="13" font-weight="700">Pipeline Blocker Gate</text>
  <text x="950" y="464" fill="#dc2626" font-size="11" font-weight="600">Exit Code: 0 (OK) / 1 (FAIL)</text>
  <text x="950" y="484" fill="#475569" font-size="11">Fails CI on breached metric</text>
  <text x="950" y="498" fill="#0284c7" font-size="10" font-weight="600">Zero Technical Debt Drift</text>

  <rect x="936" y="528" width="208" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="554" fill="#0f172a" font-size="13" font-weight="700">Merge Protection</text>
  <text x="950" y="576" fill="#15803d" font-size="11" font-weight="600">Enforces Clean Code</text>
  <text x="950" y="592" fill="#64748b" font-size="10">Full audit compliance</text>
</svg>
